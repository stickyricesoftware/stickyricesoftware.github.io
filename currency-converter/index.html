  <body>
    <div class="container py-4">
              <span class="h6" id="userName"></span>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">Currency Converter</h1>

        <div>
          <select id="themeSelector" class="form-select form-select-sm w-auto">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="charcoal">Charcoal</option>
            <option value="green">Green</option>
            <option value="amber">Amber</option>
            <option value="purple">Purple</option>
          </select>
        </div>
      </div>

      <div id="alertContainer"></div>

        <label for="baseCurrency" class="form-label">From Currency</label>

<div class="form-floating mb-3">
  <select id="baseCurrency" class="form-select">
    <!-- Options -->
  </select>
  <label for="baseCurrency">From Currency</label>
</div>

<div class="form-floating mb-3">
  <input type="text" id="amount" class="form-control" placeholder="Amount" readonly />
  <label for="amount">Amount</label>
</div>




  <div id="preview" style="margin-top:5px; color:#888; font-size:14px;"></div>
</div>
      <div class="d-flex flex-row justify-content-end">
        <div
          class="d-flex flex-column align-items-center p-2 mb-2 w-75"
          id="convertedCurrenciesRow"
        >
          <!-- Converted currencies will appear here -->
        </div>

        <div class="d-flex flex-column p-2 justify-content-start">
          <label class="form-label"></label>
          <div id="targetCurrencySelectors" class="justify-content-start"></div>
          <button
            id="addTargetCurrency"
            class="btn btn-primary btn-sm mt-2"
            type="button"
          >
            Add To Currency
          </button>
        </div>
      </div>



      <!-- <div class="mb-3">
        <label for="amount" class="form-label"></label>
        <input
          type="number"
          id="amount"
          class="form-control"
          placeholder="Enter amount"
          aria-label="Large"
          aria-describedby="inputGroup-sizing-sm"
        />
      </div> -->



<div class="mb-3 p-2">
<div id="keypad" class="keypad p-2">
  <div class="row">
    <button data-key="7">7</button>
    <button data-key="8">8</button>
    <button data-key="9">9</button>
    <button data-key="/">÷</button>
  </div>
  <div class="row">
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="6">6</button>
    <button data-key="*">×</button>
  </div>
  <div class="row">
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="-">−</button>
  </div>
  <div class="row">
    <button data-key="0">0</button>
    <button data-key=".">.</button>
    <button id="clear">C</button>
    <button data-key="+">+</button>
  </div>
  <div class="row">
    <button id="equals" class="equals">=</button>
  </div>
</div>
</div>

  <button id="install-btn" class="btn btn-primary btn-sm">Install as app</button>


    </div>

<script src="/currency-converter/script.js"></script>
  </body>
