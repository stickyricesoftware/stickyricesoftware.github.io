<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Challenge ME Chess</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    };
  </script>

   <!-- ✅ Correct ChessboardJS CSS -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css"
  />
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <!-- Navbar -->
  <nav class="bg-white dark:bg-gray-800 shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold">Challenge ME Chess</h1>
    <div class="space-x-4 hidden md:block">
      <button onclick="navigate('welcome')" class="hover:underline">Home</button>
      <button onclick="navigate('about')" class="hover:underline">About</button>
      <button onclick="navigate('play')" class="hover:underline">Play</button>
    </div>
    <div class="flex items-center space-x-3">
      <button id="themeToggle" class="p-2 bg-gray-200 dark:bg-gray-700 rounded">🌓</button>
      <button id="menuBtn" class="md:hidden p-2 bg-gray-200 dark:bg-gray-700 rounded">☰</button>
    </div>
  </nav>

  <!-- Mobile Menu -->
  <div id="mobileMenu" class="hidden bg-gray-200 dark:bg-gray-700 p-3 md:hidden">
    <button onclick="navigate('welcome')" class="block w-full text-left mb-2">Home</button>
    <button onclick="navigate('about')" class="block w-full text-left mb-2">About</button>
    <button onclick="navigate('play')" class="block w-full text-left">Play</button>
  </div>

  <!-- Content -->
  <main id="content" class="p-6"></main>


<!-- jQuery (required for chessboard-js) -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- ✅ Correct Chess Libraries (must load before your app.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.js"></script>

  <!-- Your App -->
  <script src="app.js"></script>
</body>
</html>
